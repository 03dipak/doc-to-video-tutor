[project]
name = "doc-to-video-tutor"
version = "0.1.0"
description = "Convert design docs / PPT / transcripts into beginner-friendly audio or video lessons"
readme = "README.md"
authors = [
    { name = "03dipak", email = "03dip.vaidya@gmail.com" }
]
requires-python = ">=3.12"
 dependencies = [
     "python-dotenv>=1.0",
     "requests>=2.31",
     # Pinned, not a floor: edge-tts is an unofficial wrapper around a consumer
    # endpoint, so a minor release can change the response shape without notice.
    # The known-good version is exercised by `studio tts-check` in CI.
    "edge-tts==7.2.8",
     "moviepy>=1.0.3",
     "python-pptx>=0.6.23",
     "Pillow>=10.0",
     "pydantic>=2.0",
    # Syntax colouring for the code panel. Pure-Python, BSD-licensed, and it only
    # recolours text the model already produced - it cannot invent content.
    "pygments>=2.19",
 ]

[project.scripts]
doc-to-video-tutor = "doc_to_video_tutor:main"
doc-to-studio = "doc_to_video_tutor.studio:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.11",
    "mypy>=1.15",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ARG", "RUF"]
ignore = [
    "ARG001",   # unused function args (kept for API symmetry)
    "RUF001",   # confusable characters (Unicode symbols used in UI)
    "RUF003",   # confusable characters in strings
]

[tool.mypy]
python_version = "3.12"
plugins = []
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
strict_optional = true

[[tool.mypy.overrides]]
module = ["doc_to_video_tutor.studio", "doc_to_video_tutor.studio.*"]
disallow_untyped_defs = false

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/doc_to_video_tutor/studio"]
branch = false
# Entry point only; the dispatch itself is covered by invoking the CLI.
omit = ["*/__main__.py"]

[tool.coverage.report]
# A single total across this tree is close to meaningless, because it averages
# two unrelated kinds of code: deterministic gate logic, which is pure and
# cheap to test (narration 89%, speech 95%, config 100%), against orchestration
# that needs a live provider, ffmpeg, fonts and moviepy (cli 9%, llm 22%,
# slides 27%). Gating on the raw total punishes the second kind for not being
# unit-testable while barely noticing the first kind rotting.
#
# So the floor is set against the measured baseline and the CI job reports the
# full table, leaving the per-module trend visible. Raising this number should
# mean new tests on gate logic, not mocks of argparse wiring.
fail_under = 58
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]
